<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ston">
  <!-- Square brand mark for the browser tab / notifications.
       Uses the sliced "N" from StonWordmark rather than the full wordmark:
       at 16px a four-letter wordmark turns to mush, a single glyph stays legible. -->
  <defs>
    <linearGradient id="stonFavGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFCF8B" />
      <stop offset="55%" stop-color="#D2A757" />
      <stop offset="100%" stop-color="#A87B33" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0d0c0a" />

  <!-- N glyph, scaled from the 80x100 wordmark original and centred -->
  <g transform="translate(28,18) scale(0.55)" fill="url(#stonFavGold)">
    <path d="M0,0 L13,0 L80,100 L67,100 Z" />
    <path d="M0,10.8 L13,30.2 L13,100 L0,100 Z" />
    <path d="M67,0 L80,0 L80,89.2 L67,69.8 Z" />
  </g>
</svg>
